name: Medical Secret Files CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund electron@^37 electron-builder@^26 sharp png-to-ico

      - name: Create Windows icon from the app SVG favicon
        shell: pwsh
        run: node scripts/create-windows-icon.mjs

      - name: Validate web app, JavaScript syntax and TypeScript
        shell: pwsh
        run: |
          if (!(Test-Path "www/index.html")) { throw "www/index.html is missing" }
          if (!(Test-Path "www/assets/icon.ico")) { throw "Windows icon was not generated" }
          node --check www/assets/exam-engine.js
          node --check www/assets/app-sync.js
          npm run build
          $package = Get-Content "package.json" | ConvertFrom-Json
          if ($package.version -ne "3.0.0") { throw "package.json version must be 3.0.0" }

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --windows --x64 --config electron-builder.json --publish never

      - name: Verify requested installer exists
        shell: pwsh
        run: |
          $installer = "dist-win/Medical Secret Files Setup 3.0.0.exe"
          if (!(Test-Path $installer)) { throw "Expected installer was not generated: $installer" }

      - name: Upload the single Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Secret-Files-Setup-3.0.0
          path: "dist-win/Medical Secret Files Setup 3.0.0.exe"
          if-no-files-found: error
          retention-days: 30

  bengali-ai-proofread:
    name: Bengali AI spelling and grammar review (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review Bengali text with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/bengali-ai-proofread.mjs

      - name: Upload proofreading report
        if: always() && hashFiles('bengali-proofreading-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Bengali-AI-Proofreading-Report
          path: bengali-proofreading-report.md
          retention-days: 14

  deploy-web:
    name: Deploy website to GitHub Pages
    needs: build-windows
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          rm -rf deploy_out
          mkdir -p deploy_out
          cp -r www/. deploy_out/
          cp -f favicon.svg deploy_out/favicon.svg || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_out
          branch: gh-pages
          clean: true
          single-commit: false
