name: Medical Secret Files CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund electron@^37 electron-builder@^26 sharp png-to-ico

      - name: Create Windows icon from the app SVG favicon
        shell: pwsh
        run: node scripts/create-windows-icon.mjs

      - name: Validate web app and build React SPA
        shell: pwsh
        run: |
          npm run build
          if (!(Test-Path "www/index.html")) { throw "www/index.html is missing after build" }
          if (!(Test-Path "www/assets/icon.ico")) { throw "Windows icon was not generated" }
          $package = Get-Content "package.json" | ConvertFrom-Json
          Write-Host "Building version: $($package.version)"

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --windows --x64 --config electron-builder.json --publish never

      - name: Verify requested installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-win" -Filter "Medical Secret Files Setup *.exe" |
            Where-Object { $_.Name -notlike "*.__uninstaller.exe" } |
            Select-Object -First 1
          if (-not $installer) { throw "Expected installer was not generated in dist-win" }

      - name: Upload the single Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Secret-Files-Setup
          path: "dist-win/Medical Secret Files Setup *.exe"
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    name: Deploy website to GitHub Pages
    needs: build-windows
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build React SPA
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare deployment files
        run: |
          rm -rf deploy_out
          mkdir -p deploy_out
          cp -r www/. deploy_out/
          cp -f favicon.svg deploy_out/favicon.svg || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_out
          branch: gh-pages
          clean: true
          single-commit: false
