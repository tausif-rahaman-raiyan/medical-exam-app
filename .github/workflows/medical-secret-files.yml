name: Medical Secret Files CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: msf-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Increment app version for this push
        shell: pwsh
        run: |
          node scripts/bump-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json www/version.json
          git commit -m "chore: bump app version [skip ci]"
          git push origin HEAD:main
      - name: Install build tools
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund electron@^37 electron-builder@^26 sharp png-to-ico
          $package = Get-Content "package.json" | ConvertFrom-Json
          "APP_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Validate web app and build
        shell: pwsh
        run: |
          foreach ($file in @("www/index.html","www/assets/data.js","www/assets/app-sync.js","www/assets/updater.js")) { if (!(Test-Path $file)) { throw "Required file missing: $file" } }
          node --check www/assets/data.js
          node --check www/assets/exam-engine.js
          node --check www/assets/app-sync.js
          node --check www/assets/updater.js
          node --check electron-main.cjs
          node --check preload.cjs
          npm run build
      - name: Create Windows icon
        run: node scripts/create-windows-icon.mjs
      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --windows --x64 --config electron-builder.json --publish always
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "dist-win/Medical Secret Files Setup $env:APP_VERSION.exe"
          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
      - uses: actions/upload-artifact@v4
        with:
          name: Medical-Secret-Files-Setup-${{ env.APP_VERSION }}
          path: "dist-win/Medical Secret Files Setup ${{ env.APP_VERSION }}.exe"
          if-no-files-found: error
          retention-days: 30
  deploy-web:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare deployment files
        run: |
          rm -rf deploy_out
          mkdir -p deploy_out
          cp -r www/. deploy_out/
          cp -f favicon.svg deploy_out/favicon.svg || true
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_out
          branch: gh-pages
          clean: true
          single-commit: false
