name: Build Standalone Offline Windows App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev electron electron-builder --no-audit --no-fund

      - name: Verify Offline Science Engine
        shell: bash
        run: |
          node --input-type=module -e "import './www/assets/science-formatter.js'; console.log('Offline Science Engine validated successfully:', typeof globalThis.cleanAndFormatScience);"

      - name: Build Windows Executables (.exe & Portable)
        shell: bash
        run: |
          npx electron-builder --windows --x64 \
            --config.appId="com.medicalsecretfiles.app" \
            --config.productName="Medical Secret Files" \
            --config.copyright="Copyright © 2026 Medical Secret Files" \
            --config.directories.output="dist-win" \
            --config.files="www/**/*,electron-main.cjs,package.json" \
            --config.win.target="nsis,portable" \
            --config.nsis.oneClick=false \
            --config.nsis.allowToChangeInstallationDirectory=true \
            --config.nsis.createDesktopShortcut=true \
            --config.nsis.createStartMenuShortcut=true

      - name: Upload Windows Standalone Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Secret-Files-Windows-x64
          path: |
            dist-win/*.exe
            dist-win/*.blockmap
          retention-days: 30
