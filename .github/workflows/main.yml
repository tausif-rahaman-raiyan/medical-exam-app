name: Deploy Web App
on: [push]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Gemini Key 🔐
        run: |
          # Replaces the placeholder with your GitHub Secret
          sed -i 's/__SECRET_KEY__/${{ secrets.GEMINI_API_KEY }}/g' www/index.html
          echo "Injection successful."

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www # The folder containing your HTML files
          branch: gh-pagesgit add .
git commit -m "Deploy: Web page with secure Gemini injection"
git push origin main --force