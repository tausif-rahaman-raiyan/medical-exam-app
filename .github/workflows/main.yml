name: Deploy Web App
on: [push]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Gemini Key 🔐
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Create a backup for safety
          cp www/index.html www/index.html.backup
          
          # Use a Python-based replacement for better handling of special characters
          python3 << 'EOF'
          import os
          import re
          
          gemini_key = os.environ['GEMINI_KEY']
          
          # Read the file
          with open('www/index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Replace the placeholder with the actual key
          updated_content = content.replace('__SECRET_KEY__', gemini_key)
          
          # Write back to file
          with open('www/index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          
          print("✓ Key injected successfully")
          EOF
          
          # Verify the replacement without logging the actual key
          if grep -q 'window.GEMINI_API_KEY = "[^"]*"' www/index.html; then
            echo "✓ Verified: Key is assigned to window.GEMINI_API_KEY"
          else
            echo "✗ ERROR: Could not verify key injection"
            exit 1
          fi
          
          # Extra safety check: ensure placeholder is gone
          if grep -q "__SECRET_KEY__" www/index.html; then
            echo "✗ ERROR: Placeholder __SECRET_KEY__ still exists!"
            exit 1
          else
            echo "✓ Placeholder successfully replaced"
          fi

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www # The folder containing your HTML files
          branch: gh-pages
