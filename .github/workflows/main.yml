name: Medical App Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Gemini Key 🔐
        run: |
          # This replaces the placeholder with your secret from GitHub Settings
          sed -i 's/__SECRET_KEY__/${{ secrets.GEMINI_API_KEY }}/g' www/index.html
          
          echo "Gemini API key injected."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Exam-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk