    <style>
        /* Core Reset */
        body { margin: 0; padding: 0; }
        .post-body img { max-width: 100%; height: auto; border-radius: 12px; }
        iframe { max-width: 100%; border-radius: 12px; }

        /* --- GLOBAL RESPONSIVE & OVERFLOW FIXES --- */
        .post-card { margin: 10px 5px !important; padding: 15px !important; }
        .question-card { margin: 0 0 12px 0 !important; padding: 16px !important; border-radius: 15px !important; }

        .question-card div.mt-4.p-5, 
        .question-card div[class*="bg-emerald-500/5"], 
        .question-card div[class*="bg-rose-500/5"],
        .question-card div[class*="bg-zinc-800/30"] {
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            word-break: break-word !important;
            white-space: normal !important;
            display: block !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            overflow-x: hidden !important;
        }

        .math-tex {
            display: inline-block !important;
            max-width: 100% !important;
            overflow-x: auto !important;
            vertical-align: middle;
        }

        @media (min-width: 1024px) {
            .post-card { margin: 20px auto !important; padding: 40px !important; max-width: 850px !important; }
            .question-card { padding: 32px !important; border-radius: 30px !important; }
        }

        .opt-btn {
            white-space: normal !important;
            height: auto !important;
            min-height: 50px !important;
            display: flex !important;
            align-items: center !important;
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            text-align: left !important;
        }

        .opt-btn > span {
            display: block !important;
            flex: 1 !important;                
            word-break: break-word !important;
            padding-right: 10px !important;    
        }

        .opt-btn > div span {
            display: inline-block !important;
            flex: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        :root {
            --primary-accent: #334155;    
            --light-bg: #0F172A;
            --dark-bg: #0F172A;          
            --card-light: #0F172A;
            --card-dark: #0F172A;        
            --text-main: #F1F5F9;
            --text-dark: #F1F5F9;
        }

        body {
            transition: background 0.4s, color 0.4s;
            background-color: var(--light-bg);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Inter', sans-serif; 
        }

        .dark body { background-color: var(--dark-bg); color: var(--text-dark); }

        .accordion-content { transition: max-height 0.5s cubic-bezier(0, 1, 0, 1); overflow: hidden; max-height: 0; }
        .accordion-content.open { max-height: 2000px; }

        .post-card {
            background: var(--card-light);
            border-radius: 30px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .dark .post-card, .dark #view-modules > div {
            background: #0F172A !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .btn-glow { background-color: #F87171 !important; color: white !important; }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(248, 113, 113, 0.4); transform: translateY(-2px); }

        .fa-book-medical, .fa-adjust, .fa-home { color: #E11D48 !important; }

        .dark .text-purple-800 { color: #CBD5E1 !important; }
        .dark .text-sm.opacity-60 { color: #94A3B8 !important; }
    </style>
</head>
<script>
    // --- GEMINI AI CONFIGURATION ---

        <div class="relative">

            <div class="hidden absolute right-0 mt-3 w-80 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-xl rounded-2xl shadow-2xl border dark:border-zinc-800 py-2 z-[100]" id="userDropdown">
                <div class="px-5 py-3 border-b dark:border-zinc-800">
                    <p class="text-sm font-bold truncate" id="userName">Guest User</p>
                    <p class="text-[10px] opacity-60 truncate" id="userEmail">Sign in to save progress</p>

                <button class="w-full text-left px-5 py-3 text-sm hover:bg-purple-50 dark:hover:bg-purple-900/20 flex items-center text-purple-600 font-bold" id="authBtn">
                    <i class="fa fa-google mr-3"></i> <span id="authBtnText">Login with Google</span>

                <button class="w-full text-left px-5 py-3 text-sm hover:bg-purple-50 dark:hover:bg-purple-900/20 flex items-center text-zinc-700 dark:text-zinc-200" id="myResultsBtn">

                <button class="w-full text-left px-5 py-3 text-sm hover:bg-purple-50 dark:hover:bg-purple-900/20 flex items-center text-blue-600 dark:text-blue-400" id="apiSettingsBtn">

                    <i class="fa fa-home mr-3 text-purple-500"></i> Home

                <button class="w-full text-left px-5 py-3 text-sm hover:bg-rose-50 dark:hover:bg-rose-900/20 flex items-center text-rose-600 dark:text-rose-400" id="logoutBtn" style="display: none;">

</main>

<div class="fixed inset-0 z-[300] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm" id="results-modal">
    <div class="bg-white dark:bg-zinc-900 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
        <div class="p-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white flex justify-between items-center">
            <h3 class="font-bold text-lg"><i class="fa fa-chart-bar mr-2"></i> Performance Analytics</h3>
            <button class="hover:text-red-300 transition-colors" id="close-results-modal"><i class="fa fa-times text-xl"></i></button>
        </div>
        
        <div class="flex border-b dark:border-zinc-700 bg-zinc-100 dark:bg-zinc-800/50 p-2 gap-2">
            <button class="flex-1 bg-white dark:bg-zinc-700 shadow-sm rounded-lg py-2 text-sm font-bold text-purple-600 dark:text-purple-400 transition-all" id="btn-personal-results">My Results</button>
            <button class="flex-1 rounded-lg py-2 text-sm font-bold text-zinc-500 hover:bg-white/50 dark:hover:bg-zinc-700/50 transition-all" id="btn-global-results">Global Leaderboard</button>
        </div>

        <div class="p-4 border-b dark:border-zinc-700 flex gap-2">
            <select class="flex-1 p-2 rounded-lg border dark:bg-zinc-800 dark:border-zinc-600 text-[12px] md:text-sm dark:text-white outline-none focus:border-purple-500" id="filter-subject">
                <option value="">All Subjects</option>
            </select>
            <select class="flex-1 p-2 rounded-lg border dark:bg-zinc-800 dark:border-zinc-600 text-[12px] md:text-sm dark:text-white outline-none focus:border-purple-500" id="filter-topic">
                <option value="">All Topics</option>
            </select>
            <button class="p-2 px-3 bg-rose-100 text-rose-600 dark:bg-rose-500/20 dark:text-rose-400 rounded-lg hover:bg-rose-200 dark:hover:bg-rose-500/40 transition-colors" id="clear-filters-btn">
                <i class="fa fa-trash-alt"></i>
            </button>
        </div>

        <div class="p-4 overflow-y-auto flex-1 space-y-3 min-h-[250px]" id="results-list">
        </div>
    </div>
</div>

            Made by <span class="text-purple-400 font-bold">Tausif Rahaman Raiyan</span>
        </p>
        <p class="text-[10px] text-slate-200 mt-2 uppercase tracking-widest">
            &#169; 2026 Medical Secret Files &#8226; All Rights Reserved
        </p>
        
        <div class="flex justify-center space-x-6 mt-4">
            <a class="text-slate-500 hover:text-purple-400 transition-colors" href="#"><i class="fab fa-facebook-f"></i></a>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- Load modular scripts -->
<script src="assets/data.js"></script>
<script src="assets/profile-manager.js"></script>

<script type="text/javascript">
// Firebase Setup
const firebaseConfig = {
    apiKey: "AIzaSyCeOGW02mBVV5oQAWzh9scy1xULjwPg1Ek",
    authDomain: "hazera-taju-degree-college.firebaseapp.com",
    projectId: "hazera-taju-degree-college",
    storageBucket: "hazera-taju-degree-college.firebasestorage.app",
    messagingSenderId: "110273229891",
    appId: "1:110273229891:web:28ca38967befe86a11d0f6",
    measurementId: "G-W129JR3BTP"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

// DOM Elements
const authBtn = document.getElementById('authBtn');
const authBtnText = document.getElementById('authBtnText');
const logoutBtn = document.getElementById('logoutBtn');
const userImg = document.getElementById('userImg');
const userName = document.getElementById('userName');
const userEmail = document.getElementById('userEmail');
const apiSettingsBtn = document.getElementById('apiSettingsBtn');

// Auth
authBtn.onclick = () => {
    if (!auth.currentUser) {
        auth.signInWithPopup(provider).catch(err => console.error("Login failed:", err));
    } else {
        auth.signOut();
    }
};

logoutBtn.onclick = () => {
    auth.signOut();
};

auth.onAuthStateChanged(user => {
    if (user) {
        userImg.src = user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName;
        userName.innerText = user.displayName;
        userEmail.innerText = user.email;
        authBtnText.innerText = "Sign in with different account";
        authBtn.style.display = 'none';
        logoutBtn.style.display = 'flex';
        
        window.activeUser = {
            name: user.displayName,
            email: user.email,
            photo: user.photoURL,
            uid: user.uid
        };
    } else {
        userImg.src = 'https://ui-avatars.com/api/?name=Guest&background=9333ea&color=fff';
        userName.innerText = "Guest User";
        userEmail.innerText = "Not signed in";
        authBtnText.innerText = "Login with Google";
        authBtn.style.display = 'flex';
        logoutBtn.style.display = 'none';
        window.activeUser = null;
    }
});

// Profile Dropdown
document.getElementById('profileBtn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('userDropdown').classList.toggle('hidden');
};

window.onclick = () => document.getElementById('userDropdown').classList.add('hidden');

// API Settings Button
apiSettingsBtn.onclick = () => {
    if (window.profileManager) {
        window.profileManager.showApiKeyModal();
    }
};

// Header Scroll
let lastScrollY = window.scrollY;
const header = document.getElementById('mainHeader');

window.addEventListener('scroll', () => {
    const currentScrollY = window.scrollY;
    if (currentScrollY <= 50) {
        header.style.transform = 'translateY(0)';
    } else if (currentScrollY > lastScrollY) {
        header.style.transform = 'translateY(-100%)';
    } else {
        header.style.transform = 'translateY(-100%)';
    }
    lastScrollY = currentScrollY;
});

// Leaderboard Logic
const myResultsBtn = document.getElementById('myResultsBtn');
const resultsModal = document.getElementById('results-modal');
const closeResultsModal = document.getElementById('close-results-modal');
const filterSubject = document.getElementById('filter-subject');
const filterTopic = document.getElementById('filter-topic');
const clearFiltersBtn = document.getElementById('clear-filters-btn');
const resultsList = document.getElementById('results-list');
const btnPersonal = document.getElementById('btn-personal-results');
const btnGlobal = document.getElementById('btn-global-results');

let fetchedExamResults = [];
let viewMode = 'personal'; 

// Populate filter dropdowns
function populateFilters() {
    if (typeof subjectData !== 'undefined') {
        subjectData.forEach(sub => {
            let opt = document.createElement('option');
            opt.value = sub.cat;
            opt.innerText = sub.cat;
            filterSubject.appendChild(opt);
        });
    }
}

filterSubject.addEventListener('change', (e) => {
    filterTopic.innerHTML = '<option value="">All Topics</option>';
    const selectedSub = subjectData.find(s => s.cat === e.target.value);
    if (selectedSub) {
        selectedSub.items.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.t;
            opt.innerText = item.t;
            filterTopic.appendChild(opt);
        });
    }
    fetchAndRenderData(); 
});

filterTopic.addEventListener('change', fetchAndRenderData);

clearFiltersBtn.addEventListener('click', () => {
    filterSubject.value = '';
    filterTopic.innerHTML = '<option value="">All Topics</option>';
    fetchAndRenderData();
});

btnPersonal.onclick = () => {
    viewMode = 'personal';
    btnPersonal.className = 'flex-1 bg-white dark:bg-zinc-700 shadow-sm rounded-lg py-2 text-sm font-bold text-purple-600 dark:text-purple-400 transition-all';
    btnGlobal.className = 'flex-1 rounded-lg py-2 text-sm font-bold text-zinc-500 hover:bg-white/50 dark:hover:bg-zinc-700/50 transition-all';
    fetchAndRenderData();
};

btnGlobal.onclick = () => {
    viewMode = 'global';
    btnGlobal.className = 'flex-1 bg-white dark:bg-zinc-700 shadow-sm rounded-lg py-2 text-sm font-bold text-purple-600 dark:text-purple-400 transition-all';
    btnPersonal.className = 'flex-1 rounded-lg py-2 text-sm font-bold text-zinc-500 hover:bg-white/50 dark:hover:bg-zinc-700/50 transition-all';
    fetchAndRenderData();
};

myResultsBtn.onclick = () => {
    document.getElementById('userDropdown').classList.add('hidden'); 
    resultsModal.classList.remove('hidden');
    resultsModal.classList.add('flex');
    fetchAndRenderData();
};

closeResultsModal.onclick = () => {
    resultsModal.classList.add('hidden');
    resultsModal.classList.remove('flex');
};

async function fetchAndRenderData() {
    resultsList.innerHTML = '<p class="text-center text-sm opacity-60 mt-10"><i class="fa fa-spinner fa-spin mr-2"></i>Loading data...</p>';
    try {
        let snapshot;
        const selectedTopic = filterTopic.value;
        if (viewMode === 'personal') {
            if (!auth.currentUser) {
                resultsList.innerHTML = '<p class="text-center text-rose-500 text-sm mt-10">Please sign in to view your results.</p>';
                return;
            }
            snapshot = await db.collection("exam_results").where("userId", "==", auth.currentUser.uid).get();
        } else {
            if (selectedTopic) {
                const prefixedTopic = "Secret file: " + selectedTopic;
                snapshot = await db.collection("exam_results").where("topicName", "in", [selectedTopic, prefixedTopic]).get();
            } else {
                snapshot = await db.collection("exam_results").orderBy("date", "desc").limit(100).get();
            }
        }
        fetchedExamResults = [];
        snapshot.forEach(doc => fetchedExamResults.push(doc.data()));
        renderLeaderboard();
    } catch(e) {
        console.error("Error loading results:", e);
        resultsList.innerHTML = '<p class="text-center text-rose-500 text-sm mt-10">Error loading data. Check console.</p>';
    }
}

function renderLeaderboard() {
    resultsList.innerHTML = '';
    let filteredData = fetchedExamResults;
    const selectedTopic = filterTopic.value;
    
    if (selectedTopic) {
        filteredData = filteredData.filter(r => r.topicName && r.topicName.includes(selectedTopic));
    }
    if (filteredData.length === 0) {
        resultsList.innerHTML = '<div class="text-center mt-10"><i class="fa fa-folder-open text-3xl opacity-20 mb-2"></i><p class="text-sm opacity-60">No exams found for this selection.</p></div>';
        return;
    }
    if (viewMode === 'global') {
        filteredData.sort((a, b) => b.score - a.score);
    } else {
        filteredData.sort((a, b) => b.date?.toMillis() - a.date?.toMillis());
    }

    filteredData.forEach((res, index) => {
        const dateObj = res.date ? new Date(res.date.toDate()) : new Date();
        const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const displayName = viewMode === 'global' ? (res.displayName || res.userName || 'Anonymous Player') : (res.topicName || 'Unknown Topic');
        const secondaryText = viewMode === 'global' ? `${res.topicName} • Attempt #${res.attempt || 1}` : `Attempt #${res.attempt || 1}`;
        const rankBadge = viewMode === 'global' ? `<div class="w-8 h-8 rounded-full bg-zinc-200 dark:bg-zinc-700 flex items-center justify-center font-black text-xs mr-3">${index + 1}</div>` : '';

        const div = document.createElement('div');
        div.className = "bg-zinc-50 dark:bg-zinc-800/60 p-4 rounded-xl border border-zinc-200 dark:border-zinc-700 flex justify-between items-center transition-all hover:border-purple-500/50 mb-2";
        div.innerHTML = `
            <div class="flex items-center">
                ${rankBadge}
                <div>
                    <p class="font-bold text-sm text-purple-700 dark:text-purple-400">${displayName}</p>
                    <div class="flex flex-wrap items-center gap-2 mt-1">
                        <span class="text-[9px] md:text-[10px] uppercase font-bold tracking-wider opacity-60 bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded">${secondaryText}</span>
                        <span class="text-[10px] opacity-60"><i class="fa fa-clock mr-1"></i>${dateStr}</span>
                    </div>
                </div>
            </div>
            <div class="text-right shrink-0 ml-4">
                <p class="font-black text-xl text-emerald-500">${res.score}</p>
                <p class="text-[10px] uppercase opacity-50">Score</p>
            </div>
        `;
        resultsList.appendChild(div);
    });
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    populateFilters();
});
</script>
</body>
</html>
